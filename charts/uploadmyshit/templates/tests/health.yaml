{{- /*
`helm test`: the server answers /healthz and serves the page through its Service.
*/}}
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "uploadmyshit.fullname" . }}-health
  labels:
    {{- include "uploadmyshit.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: health
      image: curlimages/curl:8.16.0
      command: ["sh", "-c"]
      args:
        - >-
          curl -fsS --max-time 10 "http://{{ include "uploadmyshit.fullname" . }}:{{ .Values.service.port }}/healthz"
          && curl -fsS --max-time 10 "http://{{ include "uploadmyshit.fullname" . }}:{{ .Values.service.port }}/" | grep -q UploadMyShit
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
