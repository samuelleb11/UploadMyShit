{{- /*
TURN and Cloudflare credentials given inline in the values. With existingSecret, or with
none given, nothing is made here.
*/}}
{{- $name := include "uploadmyshit.iceSecretName" . }}
{{- if $name }}
{{- $t := .Values.ice.turn }}
{{- $c := .Values.ice.cloudflare }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "uploadmyshit.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- with $t.username }}
  turn-username: {{ . | quote }}
  {{- end }}
  {{- with $t.credential }}
  turn-credential: {{ . | quote }}
  {{- end }}
  {{- with $t.secret }}
  turn-secret: {{ . | quote }}
  {{- end }}
  {{- with $c.keyId }}
  key-id: {{ . | quote }}
  {{- end }}
  {{- with $c.apiToken }}
  api-token: {{ . | quote }}
  {{- end }}
{{- end }}
